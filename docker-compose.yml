services:

  # =========================================================
  # 1. EUREKA SERVER
  # =========================================================

  eureka-server:
    image: sanjeev9997/eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped

    ports:
      - "8761:8761"

    networks:
      - ecommerce-network


  # =========================================================
  # 2. POSTGRESQL
  # =========================================================

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ecommerce-network


  # =========================================================
  # 3. REDIS
  # =========================================================

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - ecommerce-network


  # =========================================================
  # 4. KAFKA
  # =========================================================
  # Kafka 4.2.2 uses KRaft.
  # ZooKeeper is NOT required.
  # =========================================================

  kafka:
    image: apache/kafka:4.2.2
    container_name: ecommerce-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    networks:
      - ecommerce-network


  # =========================================================
  # 5. AUTH SERVICE
  # =========================================================

  auth-service:
    image: sanjeev9997/auth-service:latest
    container_name: auth-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 6. USER SERVICE
  # =========================================================

  user-service:
    image: sanjeev9997/user-service:latest
    container_name: user-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 7. PRODUCT SERVICE
  # =========================================================

  product-service:
    image: sanjeev9997/product-service:latest
    container_name: product-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 8. INVENTORY SERVICE
  # =========================================================

  inventory-service:
    image: sanjeev9997/inventory-service:latest
    container_name: inventory-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres
      - redis

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - ecommerce-network


  # =========================================================
  # 9. CART SERVICE
  # =========================================================

  cart-service:
    image: sanjeev9997/cart-service:latest
    container_name: cart-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres
      - redis

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - ecommerce-network


  # =========================================================
  # 10. COUPON SERVICE
  # =========================================================

  coupon-service:
    image: sanjeev9997/coupon-service:latest
    container_name: coupon-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 11. REVIEW SERVICE
  # =========================================================

  review-service:
    image: sanjeev9997/review-service:latest
    container_name: review-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 12. PAYMENT SERVICE
  # =========================================================

  payment-service:
    image: sanjeev9997/payment-service:latest
    container_name: payment-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 13. SHIPPING SERVICE
  # =========================================================

  shipping-service:
    image: sanjeev9997/shipping-service:latest
    container_name: shipping-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    networks:
      - ecommerce-network


  # =========================================================
  # 14. NOTIFICATION SERVICE
  # =========================================================

  notification-service:
    image: sanjeev9997/notification-service:latest
    container_name: notification-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - kafka

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    networks:
      - ecommerce-network


  # =========================================================
  # 15. ORDER SERVICE
  # =========================================================

  order-service:
    image: sanjeev9997/order-service:latest
    container_name: order-service
    restart: unless-stopped

    depends_on:
      - eureka-server
      - postgres
      - kafka

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    networks:
      - ecommerce-network


  # =========================================================
  # 16. GATEWAY
  # =========================================================

  gateway:
    image: sanjeev9997/gateway-server:latest
    container_name: gateway
    restart: unless-stopped

    depends_on:
      - eureka-server
      - auth-service
      - user-service
      - product-service
      - inventory-service
      - cart-service
      - coupon-service
      - review-service
      - payment-service
      - shipping-service
      - notification-service
      - order-service

    ports:
      - "8080:8080"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    networks:
      - ecommerce-network


  # =========================================================
  # 17. FRONTEND
  # =========================================================

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: http://localhost:8080

    container_name: ecommerce-frontend
    restart: unless-stopped

    depends_on:
      - gateway

    ports:
      - "3000:80"

    networks:
      - ecommerce-network


# =========================================================
# VOLUMES
# =========================================================

volumes:

  postgres-data:

  redis-data:

  kafka-data:


# =========================================================
# NETWORK
# =========================================================

networks:

  ecommerce-network:
    driver: bridge