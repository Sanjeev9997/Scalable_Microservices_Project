name: Project CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # FRONTEND CI
  # =========================================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # =========================================================
  # BACKEND CI
  # =========================================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend services
        shell: bash
        run: |
          for pom in Backend/*/pom.xml
          do
            echo "=========================================="
            echo "Building $pom"
            echo "=========================================="

            mvn -f "$pom" clean package -DskipTests
          done


  # =========================================================
  # DOCKER BUILD + PUSH
  # =========================================================

  docker-publish:
    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      # -------------------------------------------------------
      # Docker Hub Login
      # -------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -------------------------------------------------------
      # Frontend
      # -------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            sanjeev9997/frontend:latest
            sanjeev9997/frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080


      # -------------------------------------------------------
      # Backend - Jib
      # -------------------------------------------------------

      - name: Build and push backend images
        shell: bash
        run: |
          for pom in Backend/*/pom.xml
          do
            echo "=========================================="
            echo "Building Docker image for $pom"
            echo "=========================================="

            mvn -f "$pom" compile jib:build \
              -Djib.to.auth.username="${{ secrets.DOCKERHUB_USERNAME }}" \
              -Djib.to.auth.password="${{ secrets.DOCKERHUB_TOKEN }}"
          done